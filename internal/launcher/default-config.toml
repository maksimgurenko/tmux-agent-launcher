# Defaults work without a config file. Argument arrays are never shell-evaluated.
picker = "rofi"
terminal = "kitty"
presentation = "float"

[search]
roots = ["~"]
mode = "git" # Git working trees, search roots and empty directories; "all" permits every directory.
max_depth = 0 # Unlimited; set 7 to include at most seven levels below each root.
cache = true # Reuse results; stale lists refresh in the background.
exclude_hidden = false # Skip dot-prefixed directories below each explicit root.
exclude = [".git", ".cache", "node_modules", ".venv", "target"]

[profiles.codex]
label = "Codex"
command = ["codex", "--yolo"]
# shell = "zsh" # Load login/interactive configuration, enter the command once, keep the shell on exit.

[profiles.claude]
label = "Claude"
command = ["claude", "--dangerously-skip-permissions"]

[profiles.pi]
label = "Pi"
command = ["pi", "--approve"]

[profiles.opencode]
label = "OpenCode"
command = ["opencode", "--auto"]

[profiles.codex-fast]
label = "Codex (custom)"
enabled = false
command = ["codex", "--yolo"]
env = { EXAMPLE_SETTING = "value" }

# Set terminal = "custom" after adapting this example.
[terminals.custom]
command = ["other-terminal", "--app-id", "{app_id}", "--", "{command}"]
