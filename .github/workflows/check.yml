name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Build compatible tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev automake bison pkg-config
          git clone --depth 1 --branch 3.7c https://github.com/tmux/tmux.git /tmp/tmux-source
          cd /tmp/tmux-source
          sh autogen.sh
          ./configure --prefix=/tmp/tmux-install
          make -j2
          make install
          echo /tmp/tmux-install/bin >> "$GITHUB_PATH"
      - name: Check
        env:
          REQUIRE_TMUX: '1'
        run: |
          test -z "$(gofmt -l cmd internal scripts)"
          go vet ./...
          go test -race ./...
          bash -n scripts/build.sh scripts/release.sh scripts/install.sh
          ./scripts/release.sh v0.0.0-ci
